server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Stremio's streaming server on the host, reached through this site so viewers
    # don't need Stremio themselves, and the browser never hits Stremio's CORS rules.
    # Only what Peario uses, read-only: HLS fix, torrent streams, subtitle lookups.
    location ~ "^/stremio/(hlsv2/|opensubHash|stats\.json|[0-9a-fA-F]{40}/)" {
        limit_except GET HEAD { deny all; }
        rewrite ^/stremio/(.*)$ /$1 break;
        proxy_pass http://host.docker.internal:11470;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Origin "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # The page itself must be rechecked on every visit, or browsers keep running
    # an old version after an update (its scripts have versioned names, so they can be cached).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
