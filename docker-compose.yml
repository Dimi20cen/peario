x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  server:
    build: ./server
    # Runs as the host user so the log files in ./logs stay readable and deletable.
    user: "1000:1000"
    ports:
      - "8181:8181"
    environment:
      PORT: 8181
      PEM_CERT: /app/cert/tailscale.crt
      PEM_KEY: /app/cert/tailscale.key
      INTERVAL_CLIENT_CHECK: 3000
      INTERVAL_ROOM_UPDATE: 600000
      LOG_FILE: /app/logs/server.log
      LOG_MAX_BYTES: 5242880
      LOG_FILES: 3
    volumes:
      - ./server/cert:/app/cert:ro
      - ./logs:/app/logs
    logging: *logging
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VUE_APP_WS_SERVER: ${VUE_APP_WS_SERVER}
        VUE_APP_TITLE: ${VUE_APP_TITLE}
        # Everyone uses this machine's Stremio through the site (see client/nginx.conf).
        VUE_APP_STREMIO_SERVER: ${VUE_APP_STREMIO_SERVER:-/stremio}
    ports:
      - "127.0.0.1:8090:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - server
    logging: *logging
    restart: unless-stopped
